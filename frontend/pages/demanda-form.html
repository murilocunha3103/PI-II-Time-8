<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Demanda - Sistema de Acompanhamento de Demandas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/demanda-form.css">
</head>
<body>

  <header class="barra-navegacao">
    <span class="nome-sistema">Demandas PI-II</span>
    <nav class="links-navegacao">
      <a href="dashboard.html">Dashboard</a>
      <a href="demandas-lista.html" class="link-ativo">Demandas</a>
    </nav>
    <span class="usuario-logado">Nome do Usuário</span>
  </header>

  <main class="conteudo">

    <h1 id="titulo-pagina">Nova demanda</h1>

    <!-- Aqui aparecem as mensagens de erro vindas da API (por exemplo, prazo em feriado nacional) -->
    <div id="areaMensagem"></div>

    <!--
      novalidate: desliga a validação automática do navegador, porque quem vai
      validar e mostrar as mensagens de erro é o nosso próprio JavaScript
      (demanda-form.js), como pede a Reunião 3. A Reunião 5 usa este mesmo
      formulário para CADASTRAR e para EDITAR uma demanda (demanda-form.html?id=3).
    -->
    <form class="caixa-formulario" id="formulario-demanda" novalidate>

      <div class="campo">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex: Corrigir erro no login">
        <span class="mensagem-erro" id="erroTitulo"></span>
      </div>

      <div class="campo">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="4" placeholder="Descreva a demanda"></textarea>
        <span class="mensagem-erro" id="erroDescricao"></span>
      </div>

      <div class="campo">
        <label for="projeto">Projeto</label>
        <!-- As opções são preenchidas pelo JavaScript, com os projetos que o usuário enxerga (GET /projetos) -->
        <select id="projeto" name="projeto">
          <option value="">Selecione o projeto</option>
        </select>
        <span class="mensagem-erro" id="erroProjeto"></span>
      </div>

      <div class="campo">
        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo">
          <option value="tarefa">Tarefa</option>
          <option value="defeito">Defeito</option>
          <option value="melhoria">Melhoria</option>
          <option value="documentacao">Documentação</option>
        </select>
      </div>

      <div class="campo">
        <label for="prioridade">Prioridade</label>
        <select id="prioridade" name="prioridade">
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
          <option value="critica">Crítica</option>
        </select>
      </div>

      <div class="campo">
        <label for="responsavel">Responsável</label>
        <!-- As opções são os usuários vinculados ao projeto escolhido (GET /usuarios?projeto=...) -->
        <select id="responsavel" name="responsavel">
          <option value="">Sem responsável definido</option>
        </select>
      </div>

      <div class="campo">
        <label for="prazo">Prazo de finalização</label>
        <input type="date" id="prazo" name="prazo">
        <span class="mensagem-erro" id="erroPrazo"></span>
      </div>

      <div class="linha-botoes">
        <button type="submit" class="botao-salvar" id="botao-salvar">Salvar demanda</button>
        <a href="demandas-lista.html" class="botao-cancelar" id="link-cancelar">Cancelar</a>
      </div>

      <p class="mensagem-sucesso" id="mensagem-sucesso">
        Demanda salva com sucesso! Abrindo os detalhes...
      </p>

    </form>

  </main>

  <script src="../js/sessao.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/demanda-form.js"></script>
</body>
</html>
