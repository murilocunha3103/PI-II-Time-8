<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Acompanhamento de Demandas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>

  <main class="pagina-login">

    <div class="caixa-login">
      <h1>Entrar</h1>
      <p class="subtitulo">Sistema de Acompanhamento de Demandas de Desenvolvimento</p>

      <form class="formulario-login">

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@puccampinas.edu.br">
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
        </div>

        <button type="submit" class="botao-entrar">Entrar</button>

      </form>
    </div>

  </main>

</body>
</html>
