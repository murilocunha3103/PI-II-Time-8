<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demandas - Sistema de Acompanhamento de Demandas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages/demandas-lista.css">
</head>
<body>

  <header class="barra-navegacao">
    <span class="nome-sistema">Demandas PI-II</span>
    <nav class="links-navegacao">
      <a href="dashboard.html">Dashboard</a>
      <a href="demandas-lista.html" class="link-ativo">Demandas</a>
    </nav>
    <span class="usuario-logado">Nome do Usuário</span>
  </header>

  <main class="conteudo">

    <div class="cabecalho-lista">
      <h1>Demandas</h1>
      <!-- Só o Administrador e o Líder de Projeto criam demandas: o JavaScript esconde o botão para o Membro -->
      <a href="demanda-form.html" class="botao-nova-demanda" id="botao-nova-demanda">Nova demanda</a>
    </div>

    <!-- Aqui aparecem as mensagens de erro vindas da API -->
    <div id="areaMensagem"></div>

    <!--
      Esta tela não tem um formulário com botão de "enviar": a cada letra digitada na busca, ou a cada
      filtro escolhido, o demandas-lista.js pede à API (GET /demandas) a lista já filtrada e ordenada,
      sem recarregar a página. Os ids abaixo são o que o JavaScript usa para "ouvir" essas mudanças.
      Os valores dos <option> são os mesmos nomes que a API aceita (ela ignora acento e maiúscula).
      As opções de projeto e de responsável são preenchidas pelo JavaScript, com dados do banco.
    -->
    <div class="barra-filtros">
      <input type="text" id="busca-demanda" placeholder="Buscar por título, descrição ou responsável">

      <select id="filtro-status">
        <option value="">Status</option>
        <option value="Aberta">Aberta</option>
        <option value="Em andamento">Em andamento</option>
        <option value="Em revisão">Em revisão</option>
        <option value="Concluída">Concluída</option>
        <option value="Cancelada">Cancelada</option>
      </select>

      <select id="filtro-prioridade">
        <option value="">Prioridade</option>
        <option value="Crítica">Crítica</option>
        <option value="Alta">Alta</option>
        <option value="Média">Média</option>
        <option value="Baixa">Baixa</option>
      </select>

      <select id="filtro-tipo">
        <option value="">Tipo</option>
        <option value="Tarefa">Tarefa</option>
        <option value="Defeito">Defeito</option>
        <option value="Melhoria">Melhoria</option>
        <option value="Documentação">Documentação</option>
      </select>

      <select id="filtro-projeto">
        <option value="">Projeto</option>
      </select>

      <select id="filtro-responsavel">
        <option value="">Responsável</option>
      </select>

      <label class="filtro-minhas">
        <input type="checkbox" id="filtro-minhas"> Somente as minhas
      </label>
    </div>

    <div class="barra-ordenacao">
      <label for="ordenar-por">Ordenar por</label>
      <select id="ordenar-por">
        <option value="">Ordem de cadastro</option>
        <option value="prioridade">Prioridade</option>
        <option value="dataCriacao">Data de criação</option>
        <option value="prazo">Prazo de finalização</option>
        <option value="status">Status</option>
      </select>

      <select id="ordem-crescente">
        <option value="asc">Crescente</option>
        <option value="desc">Decrescente</option>
      </select>

      <span class="contagem-resultados" id="contagem-resultados"></span>
    </div>

    <table class="tabela-demandas" id="tabela-demandas">
      <thead>
        <tr>
          <th>Título</th>
          <th>Tipo</th>
          <th>Prioridade</th>
          <th>Status</th>
          <th>Projeto</th>
          <th>Responsável</th>
          <th>Criada em</th>
          <th>Prazo</th>
        </tr>
      </thead>
      <!-- As linhas são criadas pelo JavaScript, a partir das demandas que vêm do banco de dados -->
      <tbody id="corpo-tabela">
        <tr class="linha-sem-resultado"><td colspan="8">Carregando demandas...</td></tr>
      </tbody>
    </table>

  </main>

  <script src="../js/sessao.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/demandas-lista.js"></script>
</body>
</html>
